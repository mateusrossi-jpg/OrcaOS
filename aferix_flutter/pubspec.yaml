name: aferix_flutter
description: Aferix Flutter application
publish_to: 'none' # since this is not intended for publishing
environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  supabase_flutter: ^2.17.2
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  test: ^1.24.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
